name: Build SideStore IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      # 1. Generate Flutter assets & frameworks without requiring code signing
      - name: Prepare Flutter iOS Config
        run: flutter build ios --config-only --no-codesign

      # 2. Compile unsigned Runner.app directly via xcodebuild
      - name: Build Unsigned iOS App
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace \
                     -scheme Runner \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build/ios \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      # 3. Zip Runner.app into standard SideStore Payload folder
      - name: Create IPA Package
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/Build/Products/Release-iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r OrthoWearable.ipa Payload

      # 4. Upload IPA as a Workflow Artifact (Available on EVERY run)
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrthoWearable-IPA
          path: build/ios/ipa/OrthoWearable.ipa

      # 5. Upload to GitHub Releases (ONLY triggers when a tag like v1.0.0 is pushed)
      - name: Create GitHub Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/ios/ipa/OrthoWearable.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}