name: Build SideStore IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          architecture: x64

      - name: Install dependencies
        run: flutter pub get

      # 1. Build the release bundle without Apple Code Signing
      - name: Build iOS App (Unsigned)
        run: flutter build ios --release --no-codesign

      # 2. Package Runner.app into standard IPA Payload for SideStore
      - name: Create IPA Package
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r OrthoWearable.ipa Payload

      # 3. Attach IPA to GitHub Release
      - name: Create GitHub Release and Upload IPA
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/ios/iphoneos/OrthoWearable.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}